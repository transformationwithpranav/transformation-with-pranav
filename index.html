
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transformation With Pranav</title>
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
body {
  background: #101010;
  color: white;
  font-family: Arial, sans-serif;
}
header {
  text-align: center;
  padding: 30px 15px;
  border-bottom: 1px solid #d4af37;
}
.logo {
  color: #d4af37;
  font-size: 25px;
  font-weight: 900;
  letter-spacing: 2px;
}
.subtitle {
  margin-top: 10px;
  letter-spacing: 3px;
}
.gold {
  color: #d4af37;
}
.hero {
  min-height: 75vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 25px;
}
.hero h1 {
  font-size: 38px;
  line-height: 1.3;
  margin-bottom: 20px;
}
.hero p {
  color: #aaa;
  line-height: 1.8;
  margin-bottom: 30px;
}
button {
  width: 100%;
  max-width: 300px;
  padding: 16px;
  margin: 8px;
  background: #d4af37;
  color: black;
  border: 1px solid #d4af37;
  border-radius: 6px;
  font-weight: bold;
  font-size: 16px;
}
.secondary {
  background: transparent;
  color: #d4af37;
}
footer {
  text-align: center;
  color: #777;
  padding: 20px;
  font-size: 12px;
}
</style>
</head>
<body>

<header>
  <div class="logo">TRANSFORMATION</div>
  <div class="subtitle">WITH PRANAV</div>
  <p class="gold" style="margin-top:10px">
    ICN PRO WORLD CHAMPION
  </p>
</header>

<main class="hero">
  <h1>
    BUILD YOUR<br>
    <span class="gold">BEST VERSION</span>
  </h1>

  <p>
    Your transformation starts here.<br>
    Professional bodybuilding and fitness coaching.<br>
    Discipline. Consistency. Results.
  </p>

  <button id="clientLoginBtn">
    CLIENT LOGIN
  </button>

  <button id="coachLoginBtn" class="secondary">
    COACH LOGIN
  </button>
</main>

<footer>
  © 2026 TRANSFORMATION WITH PRANAV
  <br>ALL RIGHTS RESERVED
</footer>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  signOut
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

import {
  getFirestore,
  doc,
  setDoc,
  getDoc
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

  const firebaseConfig = {
  apiKey: "AIzaSyDQv5fHUsT7oiktxltMBHzAYnIYbnQr1g0",
  authDomain: "transformation-with-pranav.firebaseapp.com",
  projectId: "transformation-with-pranav",
  storageBucket: "transformation-with-pranav.firebasestorage.app",
  messagingSenderId: "485699517901",
  appId: "1:485699517901:web:7d830c2dc3fd2964735884"
};

  const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
  // CLIENT LOGIN AND REGISTRATION
document.getElementById("clientLoginBtn").onclick = async () => {
  const isNew = confirm("New client? Press OK to register.");

  const email = prompt("Enter your email:");
  if (!email) return;

  const password = prompt("Enter your password:");
  if (!password) return;

  try {
    if (isNew) {
      const name = prompt("Enter your full name:");
      if (!name) return;

      const result = await createUserWithEmailAndPassword(
        auth, email, password
      );

      await setDoc(doc(db, "users", result.user.uid), {
        name,
        email,
        role: "client"
      });

      alert("Registration successful!");
    } else {
      const result = await signInWithEmailAndPassword(
        auth, email, password
      );

      const userDoc = await getDoc(
        doc(db, "users", result.user.uid)
      );

      if (!userDoc.exists() || userDoc.data().role !== "client") {
        await signOut(auth);
        alert("Access denied.");
        return;
      }

      alert("Welcome back!");
    }
  } catch (error) {
    alert(error.message);
  }
};
  // COACH LOGIN
document.getElementById("coachLoginBtn").onclick = async () => {
    const email = prompt("Enter coach email:");
    if (!email) return;

    const password = prompt("Enter coach password:");
    if (!password) return;

    try {
        const result = await signInWithEmailAndPassword(
            auth, email, password
        );

        const userDoc = await getDoc(
            doc(db, "users", result.user.uid)
        );

        if (!userDoc.exists() || userDoc.data().role !== "coach") {
            await signOut(auth);
            alert("Access denied. Coach account only.");
            return;
        }

        alert("Welcome Coach Pranav!");

    } catch (error) {
        alert(error.message);
    }
};
</script>
  
</body>
</html>
